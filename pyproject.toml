[project]
name = "multimodal-ecommerce-qa"
version = "0.1.0"
description = "Multimodal ecommerce QA workflows for retrieval, reranking, and web search experiments."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "accelerate>=1.10.1",
  "bitsandbytes>=0.48.1",
  "datasets>=4.0.0",
  "huggingface-hub>=0.34.0",
  "mlflow>=3.13.0",
  "numpy>=2.2.4",
  "openai>=2.0.0",
  "opencc-python-reimplemented>=0.1.7",
  "pillow>=11.2.1",
  "pyarrow>=21.0.0",
  "pypdf>=5.4.0",
  "qwen-vl-utils>=0.0.11",
  "requests>=2.32.0",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "tqdm>=4.67.1",
  "transformers[serving]==5.5.0",
]

[project.scripts]
ecom-qa = "ecom_qa.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_qa"]

[tool.uv]
package = true

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "main" }
